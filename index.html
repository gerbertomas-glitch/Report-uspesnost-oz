<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manažerský Pipedrive Report</title>
    
    <!-- Tailwind CSS (pro vzhled) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Knihovna pro čtení Excel/CSV souborů -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- React a ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (pro překlad JSX kódu v prohlížeči) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- IKONY (Převedeno z Lucide React pro fungování v čistém HTML) ---
        const Upload = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        const BarChart3 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
        const Users = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const PhoneCall = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M14.05 2a9 9 0 0 1 8 7.94"/><path d="M14.05 6A5 5 0 0 1 18 10"/></svg>;
        const TrendingUp = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const FileSpreadsheet = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>;
        const AlertCircle = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const XCircle = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>;
        const Package = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>;
        const Target = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;


        // --- HLAVNÍ APLIKACE ---
        function App() {
          const [data, setData] = useState(null);
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);
          const [activeTab, setActiveTab] = useState('overview');
          const [xlsxLoaded, setXlsxLoaded] = useState(false);

          useEffect(() => {
            if (window.XLSX) {
              setXlsxLoaded(true);
              return;
            }
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
            script.async = true;
            script.onload = () => setXlsxLoaded(true);
            script.onerror = () => setError("Nepodařilo se načíst knihovnu pro čtení Excelu.");
            document.body.appendChild(script);
          }, []);

          const normalizeStr = (str) => {
            if (!str) return '';
            return String(str).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
          };

          const parseHodnota = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            let s = String(val).replace(/\s/g, ''); 
            s = s.replace(/[^\d.,-]/g, ''); 
            if (!s) return 0;
            
            let lastComma = s.lastIndexOf(',');
            let lastDot = s.lastIndexOf('.');
            
            if (lastComma > -1 && lastDot > -1) {
              if (lastComma > lastDot) {
                s = s.replace(/\./g, '').replace(',', '.');
              } else {
                s = s.replace(/,/g, '');
              }
            } else if (lastComma > -1) {
              s = s.replace(',', '.');
            }
            return parseFloat(s) || 0;
          };

          const processParsedData = (rows) => {
            if (!rows || rows.length < 2) throw new Error("Soubor neobsahuje dostatek dat.");

            const headers = rows[0].map(h => normalizeStr(h));
            const getIdx = (str) => headers.findIndex(h => h.includes(normalizeStr(str)));
            
            const idxObchodnik = getIdx('obchodnik');
            const idxVlastnik = getIdx('vlastnik'); // Pojistka
            const idxOperator = getIdx('operator');
            const idxHodnota = getIdx('hodnota');
            const idxMena = getIdx('mena') !== -1 ? getIdx('mena') : getIdx('currency');
            const idxFaze = getIdx('faze') !== -1 ? getIdx('faze') : getIdx('phase');
            const idxStav = getIdx('stav') !== -1 ? getIdx('stav') : getIdx('status');
            const idxStitek = getIdx('stitek') !== -1 ? getIdx('stitek') : getIdx('label');

            if (idxFaze === -1) {
               throw new Error("Nepodařilo se najít sloupec 'Fáze'. Zkontrolujte hlavičky v exportu.");
            }

            const parsedData = [];
            for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              if (row && row.length > 0 && row.some(cell => cell !== undefined && cell !== null && cell !== '')) {
                
                let rawHodnota = String(row[idxHodnota] || '0');
                let hodnotaNum = parseHodnota(row[idxHodnota]);
                
                let mena = 'CZK';
                if (idxMena !== -1 && row[idxMena]) {
                  mena = String(row[idxMena]).toUpperCase().trim();
                } else {
                  if (rawHodnota.toUpperCase().includes('EUR')) mena = 'EUR';
                  if (rawHodnota.toUpperCase().includes('HUF')) mena = 'HUF';
                  if (rawHodnota.toUpperCase().includes('CZK')) mena = 'CZK';
                }

                let stitky = [];
                if (idxStitek !== -1 && row[idxStitek]) {
                  stitky = String(row[idxStitek]).split(',').map(s => s.trim()).filter(s => s);
                }

                // Chytré přiřazení jména s pojistkou přes vlastníka
                let obchJmeno = '';
                if (idxObchodnik !== -1) obchJmeno = String(row[idxObchodnik] || '');
                if ((!obchJmeno || obchJmeno === 'undefined') && idxVlastnik !== -1) {
                    obchJmeno = String(row[idxVlastnik] || '');
                }
                obchJmeno = obchJmeno.trim() || 'Neznámý';

                let opJmeno = idxOperator !== -1 ? String(row[idxOperator] || '').trim() : 'Neznámý';

                parsedData.push({
                  obchodnik: obchJmeno,
                  operator: opJmeno,
                  hodnota: hodnotaNum,
                  mena: mena,
                  faze: normalizeStr(row[idxFaze]),
                  stav: normalizeStr(row[idxStav]),
                  stitky: stitky
                });
              }
            }
            setData(parsedData);
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!xlsxLoaded) return setError("Knihovna se ještě načítá.");

            setLoading(true);
            setError(null);

            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = window.XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                processParsedData(jsonData);
              } catch (err) {
                setError("Chyba při čtení souboru. Ujistěte se, že jde o platný Pipedrive export.");
              } finally {
                setLoading(false);
              }
            };
            reader.onerror = () => { setError("Chyba prohlížeče."); setLoading(false); };
            reader.readAsArrayBuffer(file);
          };

          const stats = useMemo(() => {
            if (!data) return null;

            const obchodnici = {};
            const operatori = {};
            const celkoveHodnoty = {};
            let celkemDealu = 0;
            let celkemUspech = 0;

            // Přidaná ošetření na překlepy (commision vs commission)
            const SUCCESS_PHASES = ['signed order', 'invoice sent', 'regular payment', 'partial payment', 'overdue', 'paid deal', 'commission status', 'commision status'];
            const CONDITIONS_PHASES = ['conditions sent'];
            const ORDER_SENT_PHASES = ['order sent'];
            const IN_PROCESS_PHASES = ['in process'];

            const getPhaseCategory = (faze, stav) => {
              // 1. ZTRACENÉ: Absolutní priorita. Pokud je deal ztracený, nepočítá se jako úspěch.
              if (stav.includes('ztracen') || stav === 'lost') return 'lost';
              
              // 2. ÚSPĚCH: Otevřené/vyhrané dealy v těchto fázích
              if (stav.includes('vyhran') || stav === 'won') return 'uspech';
              if (SUCCESS_PHASES.some(sf => faze.includes(sf))) return 'uspech';
              
              // 3. FÁZE V ŘEŠENÍ
              if (ORDER_SENT_PHASES.some(of => faze.includes(of))) return 'order_sent';
              if (CONDITIONS_PHASES.some(cf => faze.includes(cf))) return 'conditions_sent';
              if (IN_PROCESS_PHASES.some(ip => faze.includes(ip))) return 'in_process';
              
              // 4. OSTATNÍ (Nově sjednané, meeting arranged...)
              return 'meeting_arranged';
            };

            data.forEach(deal => {
              celkemDealu++;
              const kat = getPhaseCategory(deal.faze, deal.stav);
              if (kat === 'uspech') celkemUspech++;

              if (kat !== 'lost' && deal.hodnota > 0) {
                celkoveHodnoty[deal.mena] = (celkoveHodnoty[deal.mena] || 0) + deal.hodnota;
              }

              if (!obchodnici[deal.obchodnik]) {
                obchodnici[deal.obchodnik] = { 
                  jmeno: deal.obchodnik, pocetDealu: 0, uspech: 0, lost: 0, order_sent: 0, conditions_sent: 0, in_process: 0, meeting_arranged: 0,
                  hodnoty: {}, produkty: {} 
                };
              }
              const obch = obchodnici[deal.obchodnik];
              obch.pocetDealu++;
              obch[kat]++;
              
              if (kat !== 'lost' && deal.hodnota > 0) {
                obch.hodnoty[deal.mena] = (obch.hodnoty[deal.mena] || 0) + deal.hodnota;
              }
              
              deal.stitky.forEach(stitek => {
                obch.produkty[stitek] = (obch.produkty[stitek] || 0) + 1;
              });

              if (!operatori[deal.operator]) {
                operatori[deal.operator] = { jmeno: deal.operator, sjednano: 0, uspechZdroj: 0 };
              }
              const op = operatori[deal.operator];
              op.sjednano++;
              if (kat === 'uspech') op.uspechZdroj++;
            });

            const formatCurrency = (hodnotyObj) => {
              return Object.entries(hodnotyObj)
                .map(([mena, hodnota]) => `${hodnota.toLocaleString('cs-CZ', {maximumFractionDigits: 0})} ${mena}`)
                .join(' | ') || '0 CZK';
            };

            const obchArray = Object.values(obchodnici).map(o => {
              const konverze = o.pocetDealu > 0 ? (o.uspech / o.pocetDealu) * 100 : 0;
              const topProdukty = Object.entries(o.produkty)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);
              return { ...o, konverze, topProdukty, hodnotaStr: formatCurrency(o.hodnoty) };
            }).sort((a, b) => b.konverze - a.konverze);

            const opArray = Object.values(operatori).map(o => {
              const konverze = o.sjednano > 0 ? (o.uspechZdroj / o.sjednano) * 100 : 0;
              return { ...o, konverze };
            }).sort((a, b) => b.sjednano - a.sjednano);

            return {
              celkemDealu,
              celkemUspech,
              celkovaKonverze: celkemDealu > 0 ? (celkemUspech / celkemDealu) * 100 : 0,
              hodnotyStr: formatCurrency(celkoveHodnoty),
              obchodnici: obchArray,
              operatori: opArray,
              nadNormu: obchArray.filter(o => o.konverze >= 20).length,
              podNormu: obchArray.filter(o => o.konverze < 20).length,
            };
          }, [data]);

          const getPct = (val, total) => total > 0 ? ((val / total) * 100).toFixed(1) : '0.0';

          if (!data) {
            return (
              <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
                  <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <Target size={32} />
                  </div>
                  <h1 className="text-2xl font-bold text-slate-800 mb-2">Manažerský Pipedrive Report</h1>
                  <p className="text-slate-500 mb-8">
                    Nahrajte export z Pipedrive. Systém automaticky změří výkon obchodníků vůči <b className="text-slate-700">20% hranici konverze</b>.
                  </p>
                  
                  <label className={`relative flex flex-col items-center justify-center w-full h-40 border-2 border-slate-300 border-dashed rounded-xl ${xlsxLoaded ? 'cursor-pointer bg-slate-50 hover:bg-blue-50 hover:border-blue-300' : 'cursor-wait bg-slate-100 opacity-70'} transition-all`}>
                    <div className="flex flex-col items-center justify-center pt-5 pb-6">
                      <Upload className={`w-8 h-8 mb-3 ${xlsxLoaded ? 'text-blue-500' : 'text-slate-300 animate-pulse'}`} />
                      <p className="mb-2 text-sm text-slate-500">
                        {xlsxLoaded ? <><span className="font-semibold text-blue-600">Klikněte pro nahrání</span> nebo přetáhněte</> : 'Načítám čtečku Excelu...'}
                      </p>
                      <p className="text-xs text-slate-400">Podporováno: .xlsx, .csv</p>
                    </div>
                    <input type="file" className="hidden" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} disabled={loading || !xlsxLoaded} />
                  </label>
                  
                  {loading && <p className="mt-4 text-blue-600 font-medium">Zpracovávám data...</p>}
                  {error && <div className="mt-4 p-3 bg-red-50 text-red-600 rounded-lg flex items-center text-sm"><AlertCircle size={16} className="mr-2 shrink-0" />{error}</div>}
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-6 font-sans">
              <div className="max-w-7xl mx-auto space-y-6">
                
                <div className="flex flex-col md:flex-row md:items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900">Manažerský Dashboard</h1>
                    <p className="text-slate-500 text-sm mt-1">Cílová konverze obchodníků: Minimálně 20%</p>
                  </div>
                  <button onClick={() => setData(null)} className="mt-4 md:mt-0 px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                    Nahrát jiná data
                  </button>
                </div>

                <div className="flex flex-wrap gap-2 bg-white p-1 rounded-xl shadow-sm border border-slate-100 w-fit">
                  <button className={`px-4 py-2 text-sm font-medium rounded-lg flex items-center transition-colors ${activeTab === 'overview' ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-50'}`} onClick={() => setActiveTab('overview')}>
                    <BarChart3 size={16} className="mr-2" /> Celkový přehled
                  </button>
                  <button className={`px-4 py-2 text-sm font-medium rounded-lg flex items-center transition-colors ${activeTab === 'obchodnici' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-50'}`} onClick={() => setActiveTab('obchodnici')}>
                    <Users size={16} className="mr-2" /> Detail Obchodníků
                  </button>
                  <button className={`px-4 py-2 text-sm font-medium rounded-lg flex items-center transition-colors ${activeTab === 'operatori' ? 'bg-green-600 text-white' : 'text-slate-600 hover:bg-slate-50'}`} onClick={() => setActiveTab('operatori')}>
                    <PhoneCall size={16} className="mr-2" /> Výkon Operátorů
                  </button>
                </div>

                {/* CELKOVÝ PŘEHLED */}
                {activeTab === 'overview' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <p className="text-sm font-medium text-slate-500 mb-1">Všechny zpracované dealy</p>
                        <h3 className="text-3xl font-bold text-slate-800">{stats.celkemDealu}</h3>
                      </div>
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <p className="text-sm font-medium text-slate-500 mb-1">Úspěšně uzavřeno</p>
                        <h3 className="text-3xl font-bold text-green-600">{stats.celkemUspech}</h3>
                      </div>
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <p className="text-sm font-medium text-slate-500 mb-1">Průměrná konverze</p>
                        <h3 className={`text-3xl font-bold ${stats.celkovaKonverze >= 20 ? 'text-blue-600' : 'text-red-500'}`}>
                          {stats.celkovaKonverze.toFixed(1)}%
                        </h3>
                      </div>
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <p className="text-sm font-medium text-slate-500 mb-1">Objem v živé pipeline</p>
                        <h3 className="text-xl font-bold text-slate-800 mt-2">{stats.hodnotyStr}</h3>
                      </div>
                    </div>
                  </div>
                )}

                {/* OBCHODNÍCI */}
                {activeTab === 'obchodnici' && (
                  <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    {stats.obchodnici.map((obchodnik, idx) => {
                      const isPassing = obchodnik.konverze >= 20;
                      return (
                        <div key={idx} className={`bg-white rounded-2xl shadow-sm border-t-4 p-6 ${isPassing ? 'border-t-green-500 border-x-slate-100 border-b-slate-100' : 'border-t-red-500 border-x-slate-100 border-b-slate-100'}`}>
                          
                          <div className="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                            <div>
                              <h3 className="text-xl font-bold text-slate-800">{obchodnik.jmeno}</h3>
                              <p className="text-sm font-medium text-slate-500 mt-1">Celkem domluvených schůzek: <span className="font-bold text-slate-800">{obchodnik.pocetDealu}</span></p>
                            </div>
                            <div className="text-right flex flex-col items-end">
                              <p className="text-xs text-slate-400 uppercase font-semibold mb-1">Hlavní konverze</p>
                              <div className={`px-4 py-2 rounded-xl text-lg font-black flex items-center ${isPassing ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                {isPassing ? <TrendingUp size={20} className="mr-2"/> : <TrendingUp size={20} className="mr-2 rotate-180"/>}
                                {obchodnik.konverze.toFixed(1)} %
                              </div>
                            </div>
                          </div>

                          <div className="space-y-3 mb-6">
                            <div className="flex justify-between items-center bg-green-50 p-3 rounded-lg border border-green-100">
                              <div>
                                <p className="text-sm font-bold text-green-800">Úspěšně dokončené (Konverze)</p>
                                <p className="text-[10px] text-green-600 mt-1 uppercase font-semibold">Signed Order, Invoice, Paid, atd.</p>
                              </div>
                              <div className="text-right">
                                <p className="text-lg font-black text-green-700">{obchodnik.konverze.toFixed(1)} %</p>
                                <p className="text-xs font-semibold text-green-600">{obchodnik.uspech} dealů z {obchodnik.pocetDealu}</p>
                              </div>
                            </div>

                            <div className="flex justify-between items-center bg-amber-50 p-3 rounded-lg border border-amber-100">
                              <div>
                                <p className="text-sm font-bold text-amber-800">Rozjednané obchody</p>
                                <p className="text-[10px] text-amber-600 mt-1 uppercase font-semibold">Stav: Conditions Sent</p>
                              </div>
                              <div className="text-right">
                                <p className="text-lg font-black text-amber-700">{getPct(obchodnik.conditions_sent, obchodnik.pocetDealu)} %</p>
                                <p className="text-xs font-semibold text-amber-600">{obchodnik.conditions_sent} dealů z {obchodnik.pocetDealu}</p>
                              </div>
                            </div>

                            <div className="flex justify-between items-center bg-blue-50 p-3 rounded-lg border border-blue-100">
                              <div>
                                <p className="text-sm font-bold text-blue-800">Čeká na podpis</p>
                                <p className="text-[10px] text-blue-600 mt-1 uppercase font-semibold">Stav: Order Sent</p>
                              </div>
                              <div className="text-right">
                                <p className="text-lg font-black text-blue-700">{getPct(obchodnik.order_sent, obchodnik.pocetDealu)} %</p>
                                <p className="text-xs font-semibold text-blue-600">{obchodnik.order_sent} dealů z {obchodnik.pocetDealu}</p>
                              </div>
                            </div>

                            <div className="flex justify-between items-center bg-slate-100 p-3 rounded-lg border border-slate-200">
                              <div>
                                <p className="text-sm font-bold text-slate-800">Dlouhodobé obchody</p>
                                <p className="text-[10px] text-slate-500 mt-1 uppercase font-semibold">Stav: In Process</p>
                              </div>
                              <div className="text-right">
                                <p className="text-lg font-black text-slate-700">{getPct(obchodnik.in_process, obchodnik.pocetDealu)} %</p>
                                <p className="text-xs font-semibold text-slate-600">{obchodnik.in_process} dealů z {obchodnik.pocetDealu}</p>
                              </div>
                            </div>
                          </div>

                          <div className="flex flex-col sm:flex-row gap-6 border-t border-slate-100 pt-4">
                            <div className="flex-1 space-y-3">
                              <div className="flex items-center justify-between bg-red-50 p-2 rounded border border-red-100">
                                <p className="text-xs text-red-800 font-semibold flex items-center"><XCircle size={14} className="mr-1"/> Ztracené dealy</p>
                                <p className="text-sm font-bold text-red-700">
                                  {obchodnik.lost} <span className="text-red-500 text-xs font-medium">({getPct(obchodnik.lost, obchodnik.pocetDealu)}%)</span>
                                </p>
                              </div>
                              <div className="flex items-center justify-between p-2">
                                <p className="text-xs text-slate-500 uppercase font-semibold flex items-center"><FileSpreadsheet size={14} className="mr-1"/> Hodnota pipeline</p>
                                <p className="text-sm font-bold text-slate-800">{obchodnik.hodnotaStr}</p>
                              </div>
                            </div>

                            <div className="flex-1">
                              <p className="text-xs text-slate-400 uppercase font-semibold flex items-center mb-2"><Package size={14} className="mr-1"/> Nejčastější produkty</p>
                              {obchodnik.topProdukty.length > 0 ? (
                                <div className="space-y-1">
                                  {obchodnik.topProdukty.map(([prod, count], i) => (
                                    <div key={i} className="flex justify-between items-center text-sm bg-white border border-slate-100 px-2 py-1 rounded">
                                      <span className="truncate pr-2 text-slate-600 text-xs" title={prod}>{prod}</span>
                                      <span className="font-bold text-slate-800 bg-slate-100 px-2 rounded text-xs">{count}x</span>
                                    </div>
                                  ))}
                                </div>
                              ) : (
                                <span className="text-sm text-slate-400 italic">Žádné štítky/produkty.</span>
                              )}
                            </div>
                          </div>

                        </div>
                      );
                    })}
                  </div>
                )}

                {/* OPERÁTOŘI */}
                {activeTab === 'operatori' && (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {stats.operatori.map((operator, idx) => {
                      return (
                        <div key={idx} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition-shadow">
                          <div>
                            <h3 className="text-lg font-bold text-slate-800 flex items-center mb-4">
                              <PhoneCall size={20} className="mr-2 text-blue-500" />
                              {operator.jmeno}
                            </h3>
                            
                            <div className="space-y-4">
                              <div className="bg-slate-50 p-3 rounded-lg flex justify-between items-center">
                                <span className="text-sm text-slate-600 font-medium">Zaevidováno schůzek</span>
                                <span className="text-lg font-bold text-slate-800">{operator.sjednano}</span>
                              </div>
                              <div className="bg-green-50 p-3 rounded-lg flex justify-between items-center">
                                <span className="text-sm text-green-700 font-medium">Úspěšně dotaženo</span>
                                <span className="text-lg font-bold text-green-700">{operator.uspechZdroj}</span>
                              </div>
                            </div>
                          </div>
                          
                          <div className="mt-6 pt-4 border-t border-slate-100">
                            <p className="text-xs text-slate-500 uppercase font-semibold text-center mb-1">Míra kvality leadů (Konverze)</p>
                            <div className="flex items-center justify-center">
                              <span className={`text-2xl font-bold ${operator.konverze >= 20 ? 'text-blue-600' : 'text-slate-700'}`}>
                                {operator.konverze.toFixed(1)}%
                              </span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            </div>
          );
        }

        // Nastartování React aplikace na stránce
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
